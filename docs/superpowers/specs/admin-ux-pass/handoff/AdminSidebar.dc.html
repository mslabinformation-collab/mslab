<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:235px;height:100%;min-height:0;box-sizing:border-box;overflow-y:auto;background:#242124;color:#ccc0c8;display:flex;flex-direction:column;padding:22px 14px 16px;gap:2px;overflow-y:auto;min-height:0;font-family:Manrope,sans-serif">
  <div style="width:132px;height:52px;overflow:hidden;margin:0 0 4px 8px;flex:none"><img src="assets/logo.png" alt="MS LAB" style="width:200px;height:200px;margin:-74px 0 0 -34px;display:block;filter:invert(1)"></div>
  <div style="font-size:11px;color:#a99ba4;margin:0 0 8px 10px">Koolituskeskuse haldus</div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
    <div style="display:flex;flex-direction:column;gap:2px;padding-top:{{ g.pt }}px">
      <sc-if value="{{ g.hasLabel }}" hint-placeholder-val="{{ true }}"><div style="height:{{ g.lh }}px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:600 10px Manrope;letter-spacing:.16em;color:#a99ba4">{{ g.label }}<span style="font-size:12px;letter-spacing:0">{{ g.chev }}</span></div></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <div style="height:44px;border-radius:9px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:500 13px Manrope;background:{{ it.bg }};color:{{ it.fg }}">
          <span>{{ it.t }}</span>
          <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#e6dce2;color:#242124;font:600 11px Manrope;display:grid;place-items:center">{{ it.badge }}</span></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top:auto;flex:none;border-top:1px solid #3a3338;padding:12px 10px 0;display:flex;flex-direction:column;gap:2px">
    <span style="font-size:11px;color:#a99ba4">Sisse logitud</span>
    <span style="font-size:12px">maria@example.test</span>
    <span style="height:40px;display:flex;align-items:center;font:500 13px Manrope">Logi välja</span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:235,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ov&quot;,&quot;reg&quot;,&quot;prot&quot;,&quot;hind&quot;,&quot;par&quot;,&quot;opi&quot;,&quot;tag&quot;,&quot;mak&quot;,&quot;kool&quot;,&quot;kal&quot;,&quot;pra&quot;,&quot;ava&quot;,&quot;koo&quot;,&quot;uud&quot;,&quot;hup&quot;,&quot;uk&quot;,&quot;sea&quot;,&quot;test&quot;],&quot;default&quot;:&quot;ov&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV=[
 {label:null,items:[['ov','Ülevaade']]},
 {label:'IGAPÄEVANE TÖÖ',items:[['reg','Registreerimised','3'],['prot','Protokollid','Täna'],['hind','Hindamine','2'],['par','Päringud','7'],['opi','Õpilased'],['tag','Tagasiside','1'],['mak','Maksed ja arved','6']]},
 {label:'KOOLITUSED',items:[['kool','Koolitused'],['kal','Kalender'],['pra','Praktika']]},
 {label:'KODULEHT JA UUDISKIRI',fold:true,items:[['ava','Avaleht'],['koo','Koolitaja'],['uud','Uudised'],['hup','Hüpikaken'],['uk','Uudiskiri']]},
 {label:'HALDUS',items:[['sea','Seaded'],['test','Testimine']]}];
class Component extends DCLogic {
  renderVals(){
    const a=this.props.active??'ov';
    return {groups:NAV.map((g,i)=>{const open=!g.fold||g.items.some(x=>x[0]===a);
      return {label:g.label,hasLabel:!!g.label,pt:i?8:0,lh:g.fold?44:22,chev:g.fold?(open?'▾':'▸'):'',
        items:open?g.items.map(([id,t,b])=>({t,badge:b,hasBadge:!!b,bg:id===a?'#51434c':'transparent',fg:id===a?'#fff':'#ccc0c8'})):[]};})};
  }
}
</script>
</body>
</html>
